<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS // Menu Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:      #0a0b10;
    --bg-panel:     #12141bcc;
    --bg-panel-2:   #171a22e6;
    --bg-panel-3:   #1c1f29;
    --line:         #2a2d38;
    --line-soft:    #1b1d25;
    --text-hi:      #f4f4f5;
    --text-mid:     #a7abb5;
    --text-low:     #7d8189;
    --blue:         #2320d5;
    --blue-2:       #1852e1;
    --cyan:         #02c1fc;
    --amber:        #f5a623;
    --red:          #e0453c;
    --green:        #3ddc84;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    height:100%;
    background: var(--bg-void);
    color: var(--text-hi);
    font-family:'Inter', sans-serif;
    overflow: hidden;
  }

  .bg-glow{
    position:fixed; inset:0;
    background:
      radial-gradient(650px 420px at 12% -6%, rgba(24,82,225,.20), transparent 60%),
      radial-gradient(600px 400px at 108% 10%, rgba(2,193,252,.14), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  .bg-grid{
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 34px 34px;
    pointer-events:none;
    z-index:0;
  }

  /* ---------- gate: solo staff logueado puede ver esto ---------- */
  .lock-screen{
    position:fixed; inset:0;
    z-index: 500;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction: column;
    gap: 14px;
    background: var(--bg-void);
    text-align:center;
    padding: 24px;
  }
  .lock-screen.is-hidden{ display:none; }
  .lock-icon{ font-size: 34px; }
  .lock-title{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; }
  .lock-text{ color: var(--text-mid); font-size: 13.5px; max-width: 360px; }
  .lock-btn{
    margin-top: 6px;
    background: linear-gradient(90deg, var(--blue-2), var(--cyan));
    border:none;
    color:#04121c;
    font-weight:700;
    font-family:'Rajdhani',sans-serif;
    letter-spacing:.5px;
    padding: 11px 26px;
    border-radius: 9px;
    cursor:pointer;
  }

  /* ---------- shell ---------- */
  .app{
    position: relative;
    z-index: 1;
    display:flex;
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    width: 340px;
    min-width: 280px;
    flex: 0 0 auto;
    display:flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--bg-panel);
    backdrop-filter: blur(6px);
  }
  .sidebar-head{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .sidebar-logo{ width: 26px; height:26px; border-radius:6px; object-fit:cover; }
  .sidebar-title{
    font-family:'Rajdhani', sans-serif;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: .5px;
  }
  .sidebar-title small{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-low);
  }
  .sidebar-identity{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--amber);
    border: 1px solid rgba(245,166,35,.3);
    padding: 4px 9px;
    border-radius: 999px;
  }
  .sidebar-back{
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-mid);
    font-size: 15px;
    text-decoration: none;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .sidebar-back:hover{ border-color: var(--cyan); color: var(--cyan); }

  .test-chat-btn{
    margin: 0 16px 12px;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--text-mid);
    border-radius: 9px;
    padding: 8px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .test-chat-btn:hover{ border-color: var(--amber); color: var(--amber); }

  .sidebar-tabs{
    display:flex;
    gap: 6px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .sidebar-tab{
    flex:1;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:600;
    letter-spacing: .3px;
    color: var(--text-mid);
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 6px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .sidebar-tab.is-active{
    color: var(--cyan);
    border-color: rgba(2,193,252,.4);
    background: rgba(2,193,252,.08);
  }
  .sidebar-tab .count{
    display:inline-block;
    margin-left: 5px;
    color: var(--text-low);
  }

  .sidebar-search{
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .sidebar-search input{
    width:100%;
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text-hi);
    font-family:'Inter', sans-serif;
    font-size: 13px;
    outline:none;
  }
  .sidebar-search input:focus{ border-color: rgba(2,193,252,.4); }

  .chat-list{
    flex:1;
    overflow-y:auto;
  }
  .chat-list-empty{
    padding: 40px 20px;
    text-align:center;
    color: var(--text-low);
    font-size: 12.5px;
  }

  .chat-item{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
    transition: background .12s ease;
    position: relative;
  }
  .chat-item:hover{ background: var(--bg-panel-2); }
  .chat-item.is-selected{ background: rgba(2,193,252,.08); }
  .chat-item.is-selected::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0;
    width: 3px;
    background: linear-gradient(180deg, var(--blue-2), var(--cyan));
  }

  .chat-avatar{
    width: 42px; height:42px;
    border-radius: 50%;
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 13px;
    color: #04121c;
    background: linear-gradient(135deg, var(--blue-2), var(--cyan));
    position: relative;
  }
  .chat-avatar.is-verified{ background: linear-gradient(135deg, #1f9c5a, var(--green)); }
  .status-dot{
    position:absolute;
    right:-1px; bottom:-1px;
    width: 11px; height:11px;
    border-radius: 50%;
    border: 2px solid var(--bg-panel);
    background: var(--amber);
  }
  .status-dot.is-verified{ background: var(--green); }

  .chat-item-body{ flex:1; min-width:0; }
  .chat-item-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap: 8px;
  }
  .chat-item-name{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size: 13.5px;
    color: var(--text-hi);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chat-item-time{
    font-size: 10.5px;
    color: var(--text-low);
    flex: 0 0 auto;
  }
  .chat-item-preview{
    font-size: 12px;
    color: var(--text-mid);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top: 2px;
  }
  .chat-item-preview .from-admin-tag{ color: var(--text-low); }

  /* ---------- conversation panel ---------- */
  .conversation{
    flex:1;
    display:flex;
    flex-direction: column;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(24,82,225,.06), transparent 60%),
      var(--bg-void);
    min-width: 0;
  }
  .conv-empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction: column;
    gap: 10px;
    color: var(--text-low);
  }
  .conv-empty-icon{ font-size: 40px; opacity:.5; }

  .conv-head{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-panel);
    backdrop-filter: blur(6px);
  }
  .conv-head-name{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size: 17px;
  }
  .conv-head-sub{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mid);
  }
  .conv-head-actions{ margin-left:auto; display:flex; gap:8px; }
  .conv-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight:600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor:pointer;
    border: 1px solid var(--line);
    background: var(--bg-panel-2);
    color: var(--text-mid);
    transition: border-color .15s ease, color .15s ease;
  }
  .conv-btn.verify{ color: var(--green); border-color: rgba(61,220,132,.35); }
  .conv-btn.verify:hover{ background: rgba(61,220,132,.1); }
  .conv-btn.verify:disabled{ opacity:.5; cursor:default; }
  .conv-btn.discord{ color: var(--text-mid); }
  .conv-btn.discord:hover{ border-color: var(--cyan); color: var(--cyan); }
  .conv-nat-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight:600;
    color: var(--text-mid);
    align-self:center;
    margin-left: 4px;
  }
  .conv-nat-select{ color: var(--amber); border-color: rgba(255,176,32,.35); cursor:pointer; }
  .conv-nat-select:hover{ background: rgba(255,176,32,.1); }
  .conv-nat-select:disabled{ opacity:.5; cursor:default; }

  .conv-messages{
    flex:1;
    overflow-y:auto;
    padding: 22px;
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble{
    max-width: 62%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.45;
    word-break: break-word;
  }
  .bubble.from-player{
    align-self:flex-start;
    background: var(--bg-panel-3);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
  }
  .bubble.from-admin{
    align-self:flex-end;
    background: linear-gradient(135deg, var(--blue-2), var(--cyan));
    color: #04121c;
    border-bottom-right-radius: 3px;
  }
  .bubble.from-system{
    align-self:center;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--text-mid);
    font-style: italic;
    font-size: 12px;
  }
  .bubble-meta{
    display:block;
    margin-top: 4px;
    font-size: 10px;
    opacity:.65;
  }

  .conv-form{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: var(--bg-panel);
    backdrop-filter: blur(6px);
  }
  .conv-input{
    flex:1;
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text-hi);
    font-family:'Inter', sans-serif;
    font-size: 13.5px;
    outline:none;
  }
  .conv-input:focus{ border-color: rgba(2,193,252,.4); }
  .conv-send{
    width: 44px; height:44px;
    flex: 0 0 auto;
    border-radius: 10px;
    border:none;
    background: linear-gradient(135deg, var(--blue-2), var(--cyan));
    color:#04121c;
    font-size: 16px;
    cursor:pointer;
  }
  .conv-send:hover{ filter: brightness(1.08); }

  @media (max-width: 760px){
    .sidebar{ width: 100%; position:absolute; inset:0; z-index:5; transition: transform .2s ease; }
    .sidebar.is-hidden-mobile{ transform: translateX(-100%); }
    .conversation{ width:100%; }
    .conv-back{ display:inline-block !important; }
  }
  .conv-back{ display:none; margin-right:4px; background:none; border:none; color:var(--text-mid); font-size:18px; cursor:pointer; }

  /* ---------- language selector ---------- */
  .lang-select{
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 1100;
  }
  .lang-btn{
    display:flex;
    align-items:center;
    gap: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight:500;
    color: var(--text-mid);
    border: 1px solid var(--line);
    padding: 6px 12px 6px 6px;
    border-radius: 7px;
    background: var(--bg-panel);
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .lang-btn:hover{ color: var(--text-hi); border-color: var(--cyan); background: var(--bg-panel-2); }
  .lang-logo{ width: 22px; height: 22px; border-radius: 5px; object-fit: cover; flex: 0 0 auto; }
  .lang-caret{ font-size: 10px; color: var(--text-low); transition: transform .15s ease; }
  .lang-select.is-open .lang-caret{ transform: rotate(180deg); }
  .lang-menu{
    position:absolute;
    top: calc(100% + 8px);
    right:0;
    min-width: 150px;
    background: var(--bg-panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow:hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,0.45);
    opacity:0;
    transform: translateY(-6px);
    pointer-events:none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .lang-select.is-open .lang-menu{ opacity:1; transform: translateY(0); pointer-events:auto; }
  .lang-option{
    display:flex;
    align-items:center;
    gap: 9px;
    padding: 10px 13px;
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size: 14px;
    color: var(--text-mid);
    cursor:pointer;
    transition: background .12s ease, color .12s ease;
  }
  .lang-option:hover{ background: var(--bg-panel-2); color: var(--text-hi); }
  .lang-option.is-selected{ color: var(--cyan); }
  .lang-flag{ font-size: 15px; }
</style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <!-- ---------- LANGUAGE SELECTOR ---------- -->
  <div class="lang-select" id="lang-select">
    <button class="lang-btn" onclick="toggleLangMenu()">
      <img class="lang-logo" src="nexus-logo.png" alt="Nexus">
      <span id="lang-current-code">ES</span>
      <span class="lang-caret">▾</span>
    </button>
    <div class="lang-menu" id="lang-menu">
      <div class="lang-option" data-lang="en" onclick="setLang('en')"><span class="lang-flag">🇬🇧</span>English</div>
      <div class="lang-option is-selected" data-lang="es" onclick="setLang('es')"><span class="lang-flag">🇪🇸</span>Español</div>
      <div class="lang-option" data-lang="pt" onclick="setLang('pt')"><span class="lang-flag">🇧🇷</span>Brazil</div>
      <div class="lang-option" data-lang="pl" onclick="setLang('pl')"><span class="lang-flag">🇵🇱</span>Polaco</div>
    </div>
  </div>

  <!-- ---------- LOCK: solo staff logueado ---------- -->
  <div class="lock-screen" id="lock-screen">
    <div class="lock-icon">🔒</div>
    <div class="lock-title" data-i18n="lock_title">Acceso restringido</div>
    <div class="lock-text" data-i18n="lock_text">Este panel es solo para el STAFF de NEXUS. Iniciá sesión como administrador desde el sitio principal.</div>
    <button class="lock-btn" data-i18n="lock_btn" onclick="window.location.href='index.html'">Ir al login</button>
  </div>

  <div class="app" id="app" style="display:none;">
    <!-- ---------- SIDEBAR: lista de chats ---------- -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="sidebar-back" href="index.html" data-i18n-title="sidebar_back">←</a>
        <img class="sidebar-logo" src="nexus-logo.png" alt="Nexus">
        <div class="sidebar-title" data-i18n="sidebar_title">Menu Admin<small data-i18n="sidebar_subtitle">TICKETS &amp; CHATS</small></div>
        <div class="sidebar-identity" id="sidebar-identity">—</div>
      </div>

      <div class="sidebar-tabs">
        <div class="sidebar-tab is-active" id="tab-pending" onclick="setTab('pending')"><span data-i18n="tab_pending">Pendientes</span><span class="count" id="count-pending">0</span></div>
        <div class="sidebar-tab" id="tab-verified" onclick="setTab('verified')"><span data-i18n="tab_verified">Verificados</span><span class="count" id="count-verified">0</span></div>
        <div class="sidebar-tab" id="tab-all" onclick="setTab('all')"><span data-i18n="tab_all">Todos</span><span class="count" id="count-all">0</span></div>
      </div>

      <div class="sidebar-search">
        <input type="text" id="search-input" data-i18n-ph="search_ph" placeholder="Buscar ticket o SteamID64…" oninput="renderChatList()">
      </div>

      <button class="test-chat-btn" type="button" onclick="addTestChat()" data-i18n="test_chat_btn">🧪 Crear chat de prueba</button>

      <div class="chat-list" id="chat-list">
        <div class="chat-list-empty" data-i18n="loading_tickets">Cargando tickets…</div>
      </div>
    </div>

    <!-- ---------- CONVERSATION ---------- -->
    <div class="conversation" id="conversation">
      <div class="conv-empty" id="conv-empty">
        <div class="conv-empty-icon">💬</div>
        <div data-i18n="conv_empty">Elegí un chat de la izquierda para empezar</div>
      </div>

      <div id="conv-active" style="display:none; flex:1; flex-direction:column; min-height:0;">
        <div class="conv-head">
          <button class="conv-back" onclick="closeConversationMobile()">←</button>
          <div>
            <div class="conv-head-name" id="conv-name">—</div>
            <div class="conv-head-sub" id="conv-sub">—</div>
          </div>
          <div class="conv-head-actions">
            <button class="conv-btn verify" id="verify-btn" onclick="verifyCurrentPlayer()">✓ Verificar cuenta</button>
            <button class="conv-btn verify" id="staff-btn" onclick="toggleStaffCurrentPlayer()" style="display:none;">★ Rol</button>
            <label class="conv-nat-label" for="nationality-select" data-i18n="nationality_label">Nacionalidad:</label>
            <select class="conv-btn conv-nat-select" id="nationality-select" onchange="updateNationality()">
              <option value="">—</option>
              <option value="Argentina">Argentina</option>
              <option value="Bolivia">Bolivia</option>
              <option value="Brasil">Brasil</option>
              <option value="Chile">Chile</option>
              <option value="Colombia">Colombia</option>
              <option value="Costa Rica">Costa Rica</option>
              <option value="Cuba">Cuba</option>
              <option value="Ecuador">Ecuador</option>
              <option value="El Salvador">El Salvador</option>
              <option value="España">España</option>
              <option value="Estados Unidos">Estados Unidos</option>
              <option value="Guatemala">Guatemala</option>
              <option value="Honduras">Honduras</option>
              <option value="México">México</option>
              <option value="Nicaragua">Nicaragua</option>
              <option value="Panamá">Panamá</option>
              <option value="Paraguay">Paraguay</option>
              <option value="Perú">Perú</option>
              <option value="Portugal">Portugal</option>
              <option value="Puerto Rico">Puerto Rico</option>
              <option value="República Dominicana">República Dominicana</option>
              <option value="Uruguay">Uruguay</option>
              <option value="Venezuela">Venezuela</option>
              <option value="Alemania">Alemania</option>
              <option value="Francia">Francia</option>
              <option value="Italia">Italia</option>
              <option value="Polonia">Polonia</option>
              <option value="Reino Unido">Reino Unido</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
        </div>

        <div class="conv-messages" id="conv-messages"></div>

        <form class="conv-form" onsubmit="return sendAdminMessage(event)">
          <input class="conv-input" id="conv-input" data-i18n-ph="msg_ph" type="text" placeholder="Escribí un mensaje…" autocomplete="off">
          <button class="conv-send" type="submit">➤</button>
        </form>
      </div>
    </div>
  </div>

<script>
  /* ============ URL DEL BACKEND (Render) ============ */
  // Reemplazá esto por la URL real que te da Render cuando desplegás
  // minehost-stats-api.js. Ejemplo: "https://assipxa-api.onrender.com"
  // Sin esto, los fetch a /api/... no van a encontrar el backend porque
  // este HTML vive en un dominio distinto (nuu14.com).
  const API_BASE = "https://TU-APP.onrender.com";

  const ADMIN_KEY_STORAGE = "nexus_admin_key";
  const ADMIN_STORAGE_KEY = "nexus_admin_identity";
  const STAFF_STEAMID_KEY = "nexus_staff_steamid"; // SteamID64 de un jugador con rol STAFF/ADMIN
  const GATE_STORAGE_KEY = "nexus_gate_steamid";

  /* ============ IDIOMA ============ */
  const I18N = {
    en: {

  let currentLang = "es";

  function T(key){
    const dict = I18N[currentLang] || I18N.es;
    return dict[key] != null ? dict[key] : (I18N.es[key] || key);
  }

  function setLang(lang, isInitial){
    const dict = I18N[lang];
    if (!dict) return;
    currentLang = lang;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (!dict[key]) return;
      // Reemplaza solo el primer nodo de texto para no pisar elementos hijos (ej: el <small> del título).
      let target = null;
      for (const node of el.childNodes){
        if (node.nodeType === Node.TEXT_NODE){ target = node; break; }
      }
      if (target) target.textContent = dict[key];
      else el.textContent = dict[key];
    });

    document.querySelectorAll("[data-i18n-ph]").forEach(el => {
      const key = el.getAttribute("data-i18n-ph");
      if (dict[key]) el.placeholder = dict[key];
    });

    document.querySelectorAll("[data-i18n-title]").forEach(el => {
      const key = el.getAttribute("data-i18n-title");
      if (dict[key]) el.title = dict[key];
    });

    document.getElementById("lang-current-code").textContent = dict.code;
    document.querySelectorAll(".lang-option").forEach(o => {
      o.classList.toggle("is-selected", o.dataset.lang === lang);
    });
    document.getElementById("lang-select").classList.remove("is-open");

    // Refresca todo lo que arma texto dinámicamente en el idioma nuevo (pero no
    // en la carga inicial: ahí todavía no llegó la respuesta de refreshChatList()
    // y pisaríamos el "Cargando tickets…" con un "No hay chats acá." falso).
    if (!isInitial){
      renderChatList();
      if (currentTicket){
        if (isTestTicket(currentTicket)) renderTestConversation();
        else loadConversation();
      }
      const verifyBtn = document.getElementById("verify-btn");
      if (verifyBtn && verifyBtn.disabled) verifyBtn.textContent = T("verify_btn_done");
      else if (verifyBtn) verifyBtn.textContent = T("verify_btn_default");
      const staffBtn = document.getElementById("staff-btn");
      if (staffBtn && staffBtn.style.display !== "none"){
        staffBtn.textContent = currentPlayerRole === "STAFF" ? T("staff_btn_remove") : T("staff_btn_make");
      }
    }

    try { localStorage.setItem("nexus_admin_lang", lang); } catch (err) {}
  }

  function toggleLangMenu(){
    document.getElementById("lang-select").classList.toggle("is-open");
  }

  document.addEventListener("click", (e) => {
    const wrap = document.getElementById("lang-select");
    if (wrap && !wrap.contains(e.target)) wrap.classList.remove("is-open");
  });

  function initLang(){
    let saved = null;
    try { saved = localStorage.getItem("nexus_admin_lang"); } catch (err) {}
    setLang(saved && I18N[saved] ? saved : "es", true);
  }

  let adminKey = null;
  let adminName = null;
  let staffSteamId = null;
  let allPlayers = [];
  let currentTab = "pending";
  let currentTicket = null;
  let currentPlayerRole = "PLAYER";
  let listPoll = null;
  let convPoll = null;

  // ---- Chats de prueba: viven solo en este navegador, nunca tocan el backend ----
  // Sirven para poder probar la UI del panel (mandar mensajes, verificar, etc.)
  // sin necesitar un jugador real registrado.
  const testPlayers = {}; // ticket -> objeto con forma de "player" (igual al que devuelve /api/admin/players/:ticket)
  let testChatCounter = 0;

  function isTestTicket(ticket){
    return typeof ticket === "string" && ticket.startsWith("TEST-");
  }

  function addTestChat(){
    testChatCounter += 1;
    const ticket = "TEST-" + testChatCounter + "-" + Math.floor(Math.random() * 900 + 100);
    const now = new Date().toISOString();
    testPlayers[ticket] = {
      ticket,
      steamId64: "76561190000000" + testChatCounter,
      nickname: "Jugador de prueba " + testChatCounter,
      name: "Jugador de prueba " + testChatCounter,
      verified: false,
      role: "PLAYER",
      messages: [
        { from: "system", text: "🧪 Chat de prueba creado. Nadie del otro lado va a leer esto: es solo para probar la interfaz.", at: now },
        { from: "player", text: "Hola, esto es un mensaje de prueba de un jugador.", at: now }
      ],
      createdAt: now,
      updatedAt: now
    };
    mergeTestPlayersIntoList();
    renderChatList();
    updateTabCounts();
    openConversation(ticket);
  }

  function mergeTestPlayersIntoList(){
    const testEntries = Object.values(testPlayers).map(p => {
      const last = p.messages[p.messages.length - 1];
      return {
        ticket: p.ticket,
        steamId64: p.steamId64,
        verified: p.verified,
        role: p.role || "PLAYER",
        displayName: "🧪 " + (p.verified ? (p.nickname || p.name) : ("Nº " + p.ticket)),
        lastMessage: last ? last.text : "",
        lastMessageFrom: last ? last.from : "",
        updatedAt: p.updatedAt || p.createdAt
      };
    });
    const real = allPlayers.filter(p => !isTestTicket(p.ticket));
    allPlayers = [...testEntries, ...real];
  }

  function apiHeaders(json){
    const h = adminKey ? { "x-admin-key": adminKey } : { "x-staff-steamid": staffSteamId };
    if (json) h["Content-Type"] = "application/json";
    return h;
  }

  (function init(){
    try {
      adminKey = localStorage.getItem(ADMIN_KEY_STORAGE);
      adminName = localStorage.getItem(ADMIN_STORAGE_KEY);
      staffSteamId = localStorage.getItem(STAFF_STEAMID_KEY);
    } catch (err) {}

    // Acceso válido: código maestro (adminKey + adminName), o SteamID64
    // con rol STAFF/ADMIN asignado por un administrador.
    const hasMasterAccess = !!(adminKey && adminName);
    const hasStaffAccess = !!staffSteamId;

    if (!hasMasterAccess && !hasStaffAccess){
      document.getElementById("lock-screen").classList.remove("is-hidden");
      return;
    }

    if (!hasMasterAccess) adminKey = null; // fuerza a usar el header de staff

    document.getElementById("lock-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("sidebar-identity").textContent = adminName || ("STAFF · " + staffSteamId);

    refreshChatList();
    listPoll = setInterval(refreshChatList, 6000);
  })();

  async function refreshChatList(){
    try {
      const res = await fetch(API_BASE + "/api/admin/players", { headers: apiHeaders() });
      if (res.status === 401){
        try {
          localStorage.removeItem(ADMIN_KEY_STORAGE);
          localStorage.removeItem(STAFF_STEAMID_KEY);
        } catch (err) {}
        document.getElementById("app").style.display = "none";
        document.getElementById("lock-screen").classList.remove("is-hidden");
        return;
      }
      if (!res.ok) return;
      const data = await res.json();
      allPlayers = data.players || [];
      mergeTestPlayersIntoList();
      updateTabCounts();
      renderChatList();
    } catch (err) {
      console.warn("No se pudo cargar la lista de tickets:", err);
      // Igual mostramos los chats de prueba aunque el backend no responda.
      mergeTestPlayersIntoList();
      updateTabCounts();
      renderChatList();
    }
  }

  function updateTabCounts(){
    const pending = allPlayers.filter(p => !p.verified).length;
    const verified = allPlayers.filter(p => p.verified).length;
    document.getElementById("count-pending").textContent = pending;
    document.getElementById("count-verified").textContent = verified;
    document.getElementById("count-all").textContent = allPlayers.length;
  }

  function setTab(tab){
    currentTab = tab;
    ["pending","verified","all"].forEach(t => {
      document.getElementById("tab-" + t).classList.toggle("is-active", t === tab);
    });
    renderChatList();
  }

  function timeAgo(iso){
    if (!iso) return "";
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return T("just_now");
    if (mins < 60) return mins + "m";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h";
    return Math.floor(hrs / 24) + "d";
  }

  function renderChatList(){
    const list = document.getElementById("chat-list");
    const query = (document.getElementById("search-input").value || "").trim().toLowerCase();

    let items = allPlayers;
    if (currentTab === "pending") items = items.filter(p => !p.verified);
    if (currentTab === "verified") items = items.filter(p => p.verified);
    if (query){
      items = items.filter(p =>
        p.displayName.toLowerCase().includes(query) ||
        p.ticket.toLowerCase().includes(query) ||
        (p.steamId64 || "").toLowerCase().includes(query)
      );
    }

    if (!items.length){
      list.innerHTML = `<div class="chat-list-empty">${escapeHtml(T("no_chats"))}</div>`;
      return;
    }

    list.innerHTML = items.map(p => {
      const initials = p.verified ? (p.displayName || "?").slice(0,2).toUpperCase() : "🎫";
      const preview = p.lastMessageFrom === "admin" ? `<span class="from-admin-tag">${escapeHtml(T("you_prefix"))}</span>${escapeHtml(p.lastMessage)}` : escapeHtml(p.lastMessage || T("no_messages"));
      return `
        <div class="chat-item ${p.ticket === currentTicket ? 'is-selected' : ''}" onclick="openConversation('${p.ticket}')">
          <div class="chat-avatar ${p.verified ? 'is-verified' : ''}">${initials}<span class="status-dot ${p.verified ? 'is-verified' : ''}"></span></div>
          <div class="chat-item-body">
            <div class="chat-item-top">
              <div class="chat-item-name">${escapeHtml(p.displayName)}</div>
              <div class="chat-item-time">${timeAgo(p.updatedAt)}</div>
            </div>
            <div class="chat-item-preview">${preview}</div>
          </div>
        </div>`;
    }).join("");
  }

  function escapeHtml(str){
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  async function openConversation(ticket){
    currentTicket = ticket;
    document.getElementById("conv-empty").style.display = "none";
    document.getElementById("conv-active").style.display = "flex";
    document.getElementById("sidebar").classList.add("is-hidden-mobile");
    renderChatList();
    await loadConversation();
    if (convPoll) clearInterval(convPoll);
    convPoll = setInterval(loadConversation, 4000);
  }

  function closeConversationMobile(){
    document.getElementById("sidebar").classList.remove("is-hidden-mobile");
  }

  async function loadConversation(){
    if (!currentTicket) return;

    if (isTestTicket(currentTicket)){
      renderTestConversation();
      return;
    }

    try {
      const res = await fetch(API_BASE + "/api/admin/players/" + encodeURIComponent(currentTicket), { headers: apiHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      const p = data.player;
      if (!p) return;

      document.getElementById("conv-name").textContent = p.verified ? (p.nickname || p.name) : ("Nº " + p.ticket);
      document.getElementById("conv-sub").textContent = T("steamid_label") + p.steamId64 + (p.verified ? T("verified_suffix") : T("pending_suffix"));

      const verifyBtn = document.getElementById("verify-btn");
      verifyBtn.disabled = p.verified;
      verifyBtn.textContent = p.verified ? T("verify_btn_done") : T("verify_btn_default");

      // Asignar rol STAFF solo lo puede hacer el admin maestro (código),
      // no otro STAFF, para evitar que se auto-asciendan entre ellos.
      const staffBtn = document.getElementById("staff-btn");
      currentPlayerRole = p.role || "PLAYER";
      if (adminKey && p.verified){
        staffBtn.style.display = "";
        staffBtn.textContent = currentPlayerRole === "STAFF" ? T("staff_btn_remove") : T("staff_btn_make");
      } else {
        staffBtn.style.display = "none";
      }

      const natSelect = document.getElementById("nationality-select");
      if (natSelect) natSelect.value = p.nationality || "";

      const box = document.getElementById("conv-messages");
      const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
      box.innerHTML = (p.messages || []).map(m => {
        const cls = m.from === "player" ? "from-player" : (m.from === "admin" ? "from-admin" : "from-system");
        const who = m.from === "admin" ? (m.by || "STAFF") : "";
        return `<div class="bubble ${cls}">${escapeHtml(m.text)}<span class="bubble-meta">${who ? who + " · " : ""}${new Date(m.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>`;
      }).join("");
      if (wasAtBottom) box.scrollTop = box.scrollHeight;

      updateTabCounts();
    } catch (err) {
      console.warn("No se pudo cargar la conversación:", err);
    }
  }

  function renderTestConversation(){
    const p = testPlayers[currentTicket];
    if (!p) return;

    document.getElementById("conv-name").textContent = "🧪 " + (p.verified ? (p.nickname || p.name) : ("Nº " + p.ticket));
    document.getElementById("conv-sub").textContent = T("steamid_label") + p.steamId64 + (p.verified ? T("verified_suffix") : T("pending_suffix")) + T("test_chat_suffix");

    const verifyBtn = document.getElementById("verify-btn");
    verifyBtn.disabled = p.verified;
    verifyBtn.textContent = p.verified ? T("verify_btn_done") : T("verify_btn_default");

    currentPlayerRole = p.role || "PLAYER";
    const staffBtn = document.getElementById("staff-btn");
    staffBtn.style.display = "";
    staffBtn.textContent = currentPlayerRole === "STAFF" ? T("staff_btn_remove") : T("staff_btn_make");

    const natSelect = document.getElementById("nationality-select");
    if (natSelect) natSelect.value = p.nationality || "";

    const box = document.getElementById("conv-messages");
    const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.innerHTML = (p.messages || []).map(m => {
      const cls = m.from === "player" ? "from-player" : (m.from === "admin" ? "from-admin" : "from-system");
      const who = m.from === "admin" ? (m.by || "STAFF") : "";
      return `<div class="bubble ${cls}">${escapeHtml(m.text)}<span class="bubble-meta">${who ? who + " · " : ""}${new Date(m.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>`;
    }).join("");
    if (wasAtBottom) box.scrollTop = box.scrollHeight;

    updateTabCounts();
  }

  async function sendAdminMessage(e){
    e.preventDefault();
    if (!currentTicket) return false;
    const input = document.getElementById("conv-input");
    const text = input.value.trim();
    if (!text) return false;
    input.value = "";

    if (isTestTicket(currentTicket)){
      const p = testPlayers[currentTicket];
      if (p){
        const now = new Date().toISOString();
        p.messages.push({ from: "admin", by: adminName || "STAFF", text, at: now });
        p.updatedAt = now;
        mergeTestPlayersIntoList();
        renderChatList();
        renderTestConversation();
      }
      return false;
    }

    try {
      await fetch(API_BASE + "/api/admin/players/" + encodeURIComponent(currentTicket) + "/messages", {
        method: "POST",
        headers: apiHeaders(true),
        body: JSON.stringify({ text, adminName: adminName || "STAFF" })
      });
      loadConversation();
      refreshChatList();
    } catch (err) {
      console.warn("No se pudo enviar el mensaje:", err);
    }
    return false;
  }

  async function verifyCurrentPlayer(){
    if (!currentTicket) return;
    if (!confirm(T("confirm_verify"))) return;

    if (isTestTicket(currentTicket)){
      const p = testPlayers[currentTicket];
      if (p){
        const now = new Date().toISOString();
        p.verified = true;
        p.messages.push({ from: "system", text: "✅ Tu cuenta fue verificada por el STAFF.", at: now });
        p.updatedAt = now;
        mergeTestPlayersIntoList();
        renderChatList();
        renderTestConversation();
      }
      return;
    }

    try {
      await fetch(API_BASE + "/api/admin/players/" + encodeURIComponent(currentTicket) + "/verify", {
        method: "POST",
        headers: apiHeaders()
      });
      loadConversation();
      refreshChatList();
    } catch (err) {
      console.warn("No se pudo verificar:", err);
    }
  }

  async function toggleStaffCurrentPlayer(){
    if (!currentTicket) return;
    const nextRole = currentPlayerRole === "STAFF" ? "PLAYER" : "STAFF";
    const msg = nextRole === "STAFF" ? T("confirm_staff_add") : T("confirm_staff_remove");
    if (!confirm(msg)) return;

    if (isTestTicket(currentTicket)){
      const p = testPlayers[currentTicket];
      if (p){
        p.role = nextRole;
        p.updatedAt = new Date().toISOString();
        currentPlayerRole = nextRole;
        mergeTestPlayersIntoList();
        renderChatList();
        renderTestConversation();
      }
      return;
    }

    try {
      const res = await fetch(API_BASE + "/api/admin/players/" + encodeURIComponent(currentTicket) + "/role", {
        method: "POST",
        headers: apiHeaders(true),
        body: JSON.stringify({ role: nextRole })
      });
      if (!res.ok){
        alert(T("alert_role_error"));
        return;
      }
      loadConversation();
      refreshChatList();
    } catch (err) {
      console.warn("No se pudo cambiar el rol:", err);
    }
  }

  async function updateNationality(){
    if (!currentTicket) return;
    const select = document.getElementById("nationality-select");
    const nationality = select.value;

    if (isTestTicket(currentTicket)){
      const p = testPlayers[currentTicket];
      if (p){
        p.nationality = nationality || null;
        p.updatedAt = new Date().toISOString();
        mergeTestPlayersIntoList();
        renderChatList();
      }
      return;
    }

    select.disabled = true;
    try {
      const res = await fetch(API_BASE + "/api/admin/players/" + encodeURIComponent(currentTicket) + "/nationality", {
        method: "POST",
        headers: apiHeaders(true),
        body: JSON.stringify({ nationality })
      });
      if (!res.ok){
        alert(T("alert_role_error"));
      }
      loadConversation();
      refreshChatList();
    } catch (err) {
      console.warn("No se pudo actualizar la nacionalidad:", err);
    } finally {
      select.disabled = false;
    }
  }

  initLang();
</script>
</body>
</html>
