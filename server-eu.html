<!DOCTYPE html>
<html lang="es">
<head>
<script>
(function(){
  try{
    if(!localStorage.getItem("nexus_gate_steamid")){
      window.location.replace("index.html");
    }
  }catch(e){
    window.location.replace("index.html");
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS: SERVER / E.U.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:      #0a0b10;
    --bg-panel:     #12141b;
    --bg-panel-2:   #171a22;
    --line:         #22242c;
    --line-soft:    #1b1d25;
    --text-hi:      #f4f4f5;
    --text-mid:     #a7abb5;
    --text-low:     #63676f;
    --blue:         #2320d5;
    --blue-2:       #1852e1;
    --cyan:         #02c1fc;
    --amber:        #ffd8a8;
    --green:        #3ddc84;
    --red:          #ff4d5e;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg-void); color:var(--text-hi); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  a{ text-decoration:none; color:inherit; }
  body{
    background-image:
      radial-gradient(circle at 12% 0%, rgba(35,32,213,0.14), transparent 40%),
      radial-gradient(circle at 88% 10%, rgba(2,193,252,0.10), transparent 38%);
  }

  .shell{ max-width: 1000px; margin:0 auto; padding: 32px 24px 80px; }

  .top-bar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom: 26px;
  }
  .menu-back{
    display:flex; align-items:center; gap:8px;
    font-family:'Rajdhani', sans-serif; font-weight:600; font-size:14px;
    color: var(--text-mid); border:1px solid var(--line); padding:9px 16px 9px 13px;
    border-radius:7px; background: var(--bg-panel);
    transition: color .15s ease, border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .menu-back:hover{ color:var(--text-hi); border-color:var(--cyan); background:var(--bg-panel-2); transform:translateX(-2px); }

  .server-tag{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-mid);
    border:1px solid var(--line); padding:7px 12px; border-radius:6px; background:var(--bg-panel);
  }
  .server-tag b{ color:var(--amber); font-weight:600; }

  /* ---------- header ---------- */

  .round-header{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    flex-wrap: wrap;
    background: var(--bg-panel);
    border:1px solid var(--line);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 22px;
    position: relative;
    overflow:hidden;
  }
  .round-header::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(35,32,213,0.10), rgba(2,193,252,0.06));
  }

  .round-title-wrap{ position:relative; z-index:1; }
  .round-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:2px;
    color: var(--text-low); text-transform:uppercase; margin-bottom:6px;
  }
  .round-title{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size: 26px;
    display:flex; align-items:center; gap:10px;
  }
  .round-title .region{
    background: linear-gradient(90deg, var(--blue-2), var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .live-pill{
    display:flex; align-items:center; gap:7px;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.5px;
    color: var(--green);
    border:1px solid rgba(61,220,132,0.35);
    background: rgba(61,220,132,0.08);
    padding: 5px 11px;
    border-radius: 20px;
  }
  .live-pill .dot{
    width:7px; height:7px; border-radius:50%; background:var(--green);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(61,220,132,0.55); }
    70%{ box-shadow:0 0 0 8px rgba(61,220,132,0); }
    100%{ box-shadow:0 0 0 0 rgba(61,220,132,0); }
  }

  .round-stats{
    position:relative; z-index:1;
    display:flex; gap: 26px;
  }
  .round-stat{ text-align:right; }
  .round-stat .val{
    font-family:'JetBrains Mono', monospace; font-weight:600; font-size: 22px; color: var(--cyan);
  }
  .round-stat .lbl{
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-low); letter-spacing:0.5px;
  }

  /* ---------- table ---------- */

  .board{ background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .board-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 15px 18px; border-bottom:1px solid var(--line-soft);
  }
  .board-title{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:16px; }
  .board-sub{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--text-low); }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-family:'Rajdhani', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--text-low);
    padding:12px 18px; border-bottom:1px solid var(--line); background:var(--bg-panel-2);
  }
  th.num, td.num{ text-align:center; width:56px; }
  th.mid, td.mid{ text-align:center; }
  tbody tr{ border-bottom:1px solid var(--line-soft); transition: background .15s ease; }
  tbody tr:hover{ background: rgba(255,255,255,0.02); }
  tbody tr:last-child{ border-bottom:none; }
  td{ padding: 12px 18px; font-size:14px; }

  .player-cell{ display:flex; align-items:center; gap:11px; }
  .avatar{ width:28px; height:28px; border-radius:6px; background: linear-gradient(150deg, var(--blue), var(--cyan)); flex:0 0 auto; }
  .player-name{ font-weight:600; color:var(--text-hi); font-size:14px; }

  .rank-cell{ font-family:'JetBrains Mono', monospace; font-weight:600; color: var(--text-mid); }

  .mono{ font-family:'JetBrains Mono', monospace; font-size:13.5px; color: var(--text-mid); }
  .kd-val{ font-family:'JetBrains Mono', monospace; font-size:13.5px; color: var(--cyan); font-weight:600; }

  .elo-pos{ color: var(--green); font-family:'JetBrains Mono', monospace; font-weight:600; font-size:13.5px; }
  .elo-neg{ color: var(--red); font-family:'JetBrains Mono', monospace; font-weight:600; font-size:13.5px; }
  .elo-zero{ color: var(--text-low); font-family:'JetBrains Mono', monospace; font-weight:600; font-size:13.5px; }

  .board-foot{
    padding: 12px 18px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-low);
    border-top:1px solid var(--line-soft);
  }

  /* ---------- LANGUAGE SELECTOR ---------- */
  /* ---------- top-right bar (profile + language selector) ---------- */

  .topbar-right{
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .profile-chip{
    display: none;
    align-items: center;
    gap: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-mid);
    border: 1px solid var(--line);
    padding: 6px 12px 6px 6px;
    border-radius: 7px;
    background: var(--bg-panel);
    cursor: pointer;
    position: relative;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .profile-chip.is-visible{ display:flex; }
  .profile-chip:hover{ color: var(--text-hi); border-color: var(--cyan); background: var(--bg-panel-2); }

  .profile-avatar{
    width: 22px; height: 22px;
    border-radius: 5px;
    object-fit: cover;
    flex: 0 0 auto;
    background: linear-gradient(150deg, var(--blue), var(--cyan));
  }
  .profile-name{
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-hi);
    font-weight: 600;
  }
  .profile-dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: var(--amber);
  }
  .profile-dot.is-verified{ background: var(--green); }

  .profile-panel{
    position:absolute;
    top: calc(100% + 8px);
    right:0;
    width: 260px;
    max-width: calc(100vw - 44px);
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow:hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,0.45);
    opacity:0;
    transform: translateY(-6px);
    pointer-events:none;
    transition: opacity .15s ease, transform .15s ease;
    cursor: default;
  }
  .profile-chip.is-open .profile-panel{ opacity:1; transform: translateY(0); pointer-events:auto; }

  .profile-panel-head{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 16px 16px;
    border-bottom: 1px solid var(--line-soft);
    background: linear-gradient(135deg, rgba(35,32,213,0.14), rgba(2,193,252,0.08));
  }
  .profile-panel-avatar{
    width: 44px; height: 44px;
    border-radius: 9px;
    object-fit: cover;
    flex: 0 0 auto;
    background: linear-gradient(150deg, var(--blue), var(--cyan));
  }
  .profile-panel-name{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size: 16.5px;
    color: var(--text-hi);
    white-space: nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width: 150px;
  }
  .profile-status-badge{
    display:inline-flex;
    align-items:center;
    gap: 5px;
    margin-top: 3px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight:600;
    letter-spacing:.4px;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(255,216,168,0.14);
    color: var(--amber);
    border: 1px solid rgba(255,216,168,0.35);
  }
  .profile-status-badge.is-verified{
    background: rgba(61,220,132,0.14);
    color: var(--green);
    border-color: rgba(61,220,132,0.35);
  }

  .profile-panel-body{
    padding: 14px 16px 16px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .profile-tile{
    background: var(--bg-panel-2);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 9px 11px;
  }
  .profile-tile.span-2{ grid-column: 1 / -1; }
  .profile-tile .profile-tile-label{
    font-family:'Rajdhani', sans-serif;
    font-size: 10.5px;
    font-weight:600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-low);
    margin-bottom: 4px;
  }
  .profile-tile .profile-tile-value{
    font-family:'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight:600;
    color: var(--text-hi);
  }
  .profile-tile.accent .profile-tile-value{ color: var(--cyan); }

  .lang-select{ position: relative; z-index: 60; }
  .lang-btn{
    display:flex; align-items:center; gap: 8px;
    font-family:'JetBrains Mono', monospace; font-size: 12.5px; font-weight:500;
    color: var(--text-mid); border: 1px solid var(--line); padding: 6px 12px 6px 6px;
    border-radius: 7px; background: var(--bg-panel); cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .lang-btn:hover{ color: var(--text-hi); border-color: var(--cyan); background: var(--bg-panel-2); }
  .lang-logo{ width: 22px; height: 22px; border-radius: 5px; object-fit: cover; flex: 0 0 auto; }
  .lang-caret{ font-size: 10px; color: var(--text-low); transition: transform .15s ease; }
  .lang-select.is-open .lang-caret{ transform: rotate(180deg); }
  .lang-menu{
    position:absolute; top: calc(100% + 8px); right:0; min-width: 150px;
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 9px;
    overflow:hidden; box-shadow: 0 14px 34px rgba(0,0,0,0.45);
    opacity:0; transform: translateY(-6px); pointer-events:none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .lang-select.is-open .lang-menu{ opacity:1; transform: translateY(0); pointer-events:auto; }
  .lang-option{
    display:flex; align-items:center; gap: 9px; padding: 10px 13px;
    font-family:'Rajdhani', sans-serif; font-weight:600; font-size: 14px;
    color: var(--text-mid); cursor:pointer;
    transition: background .12s ease, color .12s ease;
  }
  .lang-option:hover{ background: var(--bg-panel-2); color: var(--text-hi); }
  .lang-option.is-selected{ color: var(--cyan); }
  .lang-flag{ font-size: 15px; }
</style>
</head>
<body>

  <!-- ================= LANGUAGE SELECTOR ================= -->
  <div class="topbar-right" id="topbar-right">

    <!-- ---------- PROFILE CHIP (visible once registered) ---------- -->
    <div class="profile-chip" id="profile-chip" onclick="toggleProfilePanel(event)">
      <img class="profile-avatar" id="profile-avatar" src="nexus-logo.png" alt="">
      <span class="profile-dot" id="profile-dot"></span>
      <span class="profile-name" id="profile-name">—</span>

      <div class="profile-panel" id="profile-panel" onclick="event.stopPropagation()">
        <div class="profile-panel-head">
          <img class="profile-panel-avatar" id="profile-panel-avatar" src="nexus-logo.png" alt="">
          <div>
            <div class="profile-panel-name" id="profile-panel-name">—</div>
            <div class="profile-status-badge" id="profile-status-badge">En Progreso</div>
          </div>
        </div>
        <div class="profile-panel-body">
          <div class="profile-tile span-2">
            <div class="profile-tile-label" id="profile-nat-label">Nacionalidad</div>
            <div class="profile-tile-value" id="profile-nationality">—</div>
          </div>
          <div class="profile-tile">
            <div class="profile-tile-label" id="profile-kills-label">Kills</div>
            <div class="profile-tile-value" id="profile-kills">—</div>
          </div>
          <div class="profile-tile">
            <div class="profile-tile-label" id="profile-deaths-label">Deaths</div>
            <div class="profile-tile-value" id="profile-deaths">—</div>
          </div>
          <div class="profile-tile accent span-2">
            <div class="profile-tile-label" id="profile-kd-label">K/D Ratio</div>
            <div class="profile-tile-value" id="profile-kd">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ---------- LANGUAGE SELECTOR ---------- -->
    <div class="lang-select" id="lang-select">
      <button class="lang-btn" onclick="toggleLangMenu()">
        <img class="lang-logo" src="nexus-logo.png" alt="Nexus">
        <span id="lang-current-code">EN</span>
        <span class="lang-caret">▾</span>
      </button>
      <div class="lang-menu" id="lang-menu">
        <div class="lang-option is-selected" data-lang="en" onclick="setLang('en')"><span class="lang-flag">🇬🇧</span>English</div>
        <div class="lang-option" data-lang="es" onclick="setLang('es')"><span class="lang-flag">🇪🇸</span>Español</div>
        <div class="lang-option" data-lang="pt" onclick="setLang('pt')"><span class="lang-flag">🇧🇷</span>Brazil</div>
        <div class="lang-option" data-lang="pl" onclick="setLang('pl')"><span class="lang-flag">🇵🇱</span>Polaco</div>
      </div>
    </div>

  </div>

  <div class="shell">

    <div class="top-bar">
      <a class="menu-back" href="index.html">← <span id="menu-back-label">Volver Al Menú</span></a>
    </div>

    <div class="round-header">
      <div class="round-title-wrap">
        <div class="round-title"><span class="region">Server</span>&nbsp;Europe</div>
        <div class="live-pill" style="margin-top:10px;"><span class="dot"></span>LIVE — ROUND IN PROGRESS</div>
      </div>
      <div class="round-stats">
        <div class="round-stat">
          <div class="val">0/15</div>
          <div class="lbl">ACTIVE PLAYERS</div>
        </div>
        <div class="round-stat">
          <div class="val">05:17</div>
          <div class="lbl">ROUND TIME</div>
        </div>
      </div>
    </div>

    <div class="board">
      <div class="board-head">
        <div class="board-title">Round Leaderboard</div>
      </div>

      <table>
        <thead>
          <tr>
            <th class="num">#</th>
            <th>Player</th>
            <th class="mid">Kills</th>
            <th class="mid">Deaths</th>
            <th class="mid">K/D Ratio</th>
            <th class="mid">+ELO</th>
          </tr>
        </thead>
        <tbody id="board-body"></tbody>
      </table>

      <div class="board-foot">IP SERVER: <span class="mono" style="color:var(--cyan);">89.144.32.13:23001</span></div>
    </div>

  </div>

<script>
  const PLAYERS = [];

  function eloClass(e){ return e > 0 ? "elo-pos" : e < 0 ? "elo-neg" : "elo-zero"; }
  function eloText(e){ return e > 0 ? `+${e}` : `${e}`; }

  const body = document.getElementById("board-body");

  if (PLAYERS.length === 0){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="6" style="text-align:center; color:var(--text-low); padding:24px 18px;">No players connected</td>`;
    body.appendChild(tr);
  }

  PLAYERS
    .slice()
    .sort((a,b) => (b.kills/(b.deaths||1)) - (a.kills/(a.deaths||1)))
    .forEach((p, i) => {
      const kd = (p.kills / (p.deaths || 1)).toFixed(2);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="num rank-cell">${i+1}</td>
        <td>
          <div class="player-cell">
            <div class="avatar"></div>
            <div class="player-name">${p.name}</div>
          </div>
        </td>
        <td class="mid mono">${p.kills}</td>
        <td class="mid mono">${p.deaths}</td>
        <td class="mid kd-val">${kd}</td>
        <td class="mid ${eloClass(p.elo)}">${eloText(p.elo)}</td>
      `;
      body.appendChild(tr);
    });

  /* ============ LANGUAGE SELECTOR ============ */
  const BACK_LABEL = {
    en: "Back To Menu",
    es: "Volver Al Menú",
    pt: "Voltar Ao Menu",
    pl: "Powrót Do Menu"
  };
  const LANG_CODE = { en:"EN", es:"ES", pt:"PT-BR", pl:"PL" };

  function setLang(lang){
    const label = document.getElementById("menu-back-label");
    if (label) label.textContent = BACK_LABEL[lang] || BACK_LABEL.en;

    document.getElementById("lang-current-code").textContent = LANG_CODE[lang] || "EN";
    document.querySelectorAll(".lang-option").forEach(o => {
      o.classList.toggle("is-selected", o.dataset.lang === lang);
    });
    document.getElementById("lang-select").classList.remove("is-open");

    currentProfileLang = lang;
    if (currentProfileData) renderProfile(currentProfileData);
  }

  function toggleLangMenu(){
    document.getElementById("lang-select").classList.toggle("is-open");
  }

  document.addEventListener("click", (e) => {
    const wrap = document.getElementById("lang-select");
    if (wrap && !wrap.contains(e.target)) wrap.classList.remove("is-open");

    const chip = document.getElementById("profile-chip");
    if (chip && !chip.contains(e.target)) chip.classList.remove("is-open");
  });

  /* ============ PROFILE CHIP (nombre + foto de Steam) ============ */

  const GATE_STORAGE_KEY = "nexus_gate_steamid";
  const PROFILE_STORAGE_KEY = "nexus_gate_profile";

  // Reemplazá esto por tu backend real, que reciba el SteamID64 y devuelva
  // { name, avatarUrl, nationality, verified, kills, deaths, kd }
  const PROFILE_ENDPOINT = "https://TU-BACKEND-AQUI.com/api/profile";

  let currentProfileData = null;
  let currentProfileLang = "en";

  const PROFILE_I18N = {
    en:{ pending:"In Progress", verified:"Verified", nationality:"Nationality", kills:"Kills", deaths:"Deaths", kd:"K/D Ratio" },
    es:{ pending:"En Progreso", verified:"Verificado", nationality:"Nacionalidad", kills:"Kills", deaths:"Deaths", kd:"K/D Ratio" },
    pt:{ pending:"Em Andamento", verified:"Verificado", nationality:"Nacionalidade", kills:"Kills", deaths:"Deaths", kd:"K/D Ratio" },
    pl:{ pending:"W Trakcie", verified:"Zweryfikowany", nationality:"Narodowość", kills:"Kills", deaths:"Deaths", kd:"K/D Ratio" }
  };

  function showProfileChip(steamId64){
    document.getElementById("profile-chip").classList.add("is-visible");

    let cached = null;
    try {
      const raw = localStorage.getItem(PROFILE_STORAGE_KEY);
      if (raw) cached = JSON.parse(raw);
    } catch (err) {}

    if (cached && cached.steamId64 === steamId64){
      renderProfile(cached);
    } else {
      renderProfile({
        steamId64: steamId64,
        name: "Jugador " + steamId64.slice(-4),
        avatarUrl: "nexus-logo.png",
        nationality: "—",
        verified: false,
        kills: "—",
        deaths: "—",
        kd: "—"
      });
    }

    loadProfileData(steamId64);
  }

  async function loadProfileData(steamId64){
    try {
      const res = await fetch(PROFILE_ENDPOINT + "?steamId64=" + encodeURIComponent(steamId64));
      if (!res.ok) throw new Error("bad response");
      const data = await res.json();
      data.steamId64 = steamId64;
      renderProfile(data);
      try { localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(data)); } catch (err) {}
    } catch (err) {
      // Todavía no configuraste PROFILE_ENDPOINT: se queda con el placeholder / último dato cacheado.
      console.warn("No se pudo cargar el perfil desde el backend:", err);
    }
  }

  function renderProfile(data){
    currentProfileData = data;
    const dict = PROFILE_I18N[currentProfileLang] || PROFILE_I18N.en;

    document.getElementById("profile-name").textContent = data.name || "—";
    document.getElementById("profile-avatar").src = data.avatarUrl || "nexus-logo.png";
    document.getElementById("profile-panel-name").textContent = data.name || "—";
    document.getElementById("profile-panel-avatar").src = data.avatarUrl || "nexus-logo.png";
    document.getElementById("profile-nationality").textContent = data.nationality || "—";
    document.getElementById("profile-kills").textContent = (data.kills ?? "—");
    document.getElementById("profile-deaths").textContent = (data.deaths ?? "—");
    document.getElementById("profile-kd").textContent = (data.kd ?? "—");

    document.getElementById("profile-nat-label").textContent = dict.nationality;
    document.getElementById("profile-kills-label").textContent = dict.kills;
    document.getElementById("profile-deaths-label").textContent = dict.deaths;
    document.getElementById("profile-kd-label").textContent = dict.kd;

    const dot = document.getElementById("profile-dot");
    const badge = document.getElementById("profile-status-badge");

    if (data.verified){
      dot.classList.add("is-verified");
      badge.classList.add("is-verified");
      badge.textContent = dict.verified;
    } else {
      dot.classList.remove("is-verified");
      badge.classList.remove("is-verified");
      badge.textContent = dict.pending;
    }
  }

  function toggleProfilePanel(e){
    if (e) e.stopPropagation();
    document.getElementById("profile-chip").classList.toggle("is-open");
  }

  (function checkProfileOnLoad(){
    try {
      const savedId = localStorage.getItem(GATE_STORAGE_KEY);
      if (savedId) showProfileChip(savedId);
    } catch (err) {}
  })();
</script>

</body>
</html>
